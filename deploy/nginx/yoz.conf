# /etc/nginx/sites-available/codial-yoz  — «Codial Yoz» (mustaqil statik sayt, Docker va API kerak emas)
# DNS: ahost.uz'da A yozuv  yoz → 77.42.9.23,  keyin SSL:  certbot --nginx -d yoz.codialinfo.uz
server {
    listen 80;
    server_name yoz.codialinfo.uz;

    root /srv/codial-test/yoz;
    index index.html;

    # Xavfsizlik sarlavhalari (ichki location'larda add_header bo'lsa qayta yoziladi — pastga qarang)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Sayt ichida kerak bo'lmagan fayllar tashqariga chiqmasin
    location ~ ^/(tests|README\.md) { return 404; }

    # index.html keshlanmaydi, assets ?v= bilan keshlanadi
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
    location /assets/ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri /index.html; }
}
