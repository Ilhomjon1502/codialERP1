# /etc/nginx/sites-available/codial-test  (asosiy muhit uchun nusxa: domen, papka va portni almashtiring)
# SSL'ni certbot qo'shadi:  sudo certbot --nginx -d test.codial.uz
server {
    listen 80;
    server_name test.codial.uz;

    root /srv/codial-test/frontend;
    index index.html;
    client_max_body_size 10m;

    # Xavfsizlik sarlavhalari (ichki location'larda add_header bo'lsa qayta yoziladi — pastga qarang)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API, Django admin va ularning statik fayllari — Docker'dagi Gunicorn'ga
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Front-end: index.html keshlanmaydi, assets ?v= bilan uzoq keshlanadi
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
    location /assets/ { expires 7d; }
    location / { try_files $uri /index.html; }
}
