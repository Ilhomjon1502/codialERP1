# /etc/nginx/sites-available/codial-test  (asosiy muhit uchun nusxa: domen, papka va portni almashtiring)
# SSL'ni certbot qo'shadi:  sudo certbot --nginx -d erp.codialinfo.uz
server {
    listen 80;
    server_name erp.codialinfo.uz;

    root /srv/codial-test/frontend;
    index index.html;
    client_max_body_size 80m;   # suhbat yozuvlari (calls/recordings/) — 2026-11-18

    # Xavfsizlik sarlavhalari (ichki location'larda add_header bo'lsa qayta yoziladi — pastga qarang)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API, Django admin va ularning statik fayllari — Docker'dagi Gunicorn'ga
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Front-end: index.html keshlanmaydi, assets ?v= bilan uzoq keshlanadi
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
    # Telegram Mini App (darslik): Telegram Web uni iframe ichida ochadi, shuning uchun faqat shu sahifaga Telegram saytlari ruxsat etiladi
    location = /learn.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://webz.telegram.org https://k.telegram.org https://z.telegram.org https://a.telegram.org" always;
    }
    location /assets/ { expires 7d; }
    location / { try_files $uri /index.html; }
}
