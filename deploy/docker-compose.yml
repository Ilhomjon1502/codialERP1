# Bitta muhit (test yoki asosiy): PostgreSQL + Django (Gunicorn).
# Nginx va SSL serverning o'zida (docs/deploy_hetzner.md). Ishga tushirish:
#   cd /srv/codial-test/deploy && docker compose --env-file .env up -d --build
name: codial-${ENV_NAME:-test}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  web:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8001}:8000"
    volumes:
      - media:/app/media

volumes:
  db:
  media:
